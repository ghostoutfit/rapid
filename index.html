<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Microneurography</title>
  <style>
    :root {
      --bar-h: 200px;
      --box-w: 200px;
      --trace: #39ff14;      /* classic oscilloscope green */
      --panel: #0b0f14;
      /* 10× version of the arm picture (shown at 200px in the bar) */
      --bg-size: 2000px;
      --bg-x: -260px;        /* tunable via dev sliders */
      --bg-y: 80px;
      /* Surface behind the arm: ivory top half, gray tabletop bottom half */
      --ivory: #f6f1e0;
      --tabletop: #8f8d86;
      --surface: linear-gradient(to bottom, var(--ivory) 0 50%, var(--tabletop) 50% 100%);
      /* Graph box size (tunable via dev sliders) */
      --graph-w: 1000px;
      --graph-h: 320px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #11151b;
      color: #e8edf2;
    }

    /* ── Menu bar ───────────────────────────────── */
    .menubar {
      height: var(--bar-h);
      display: flex;
      align-items: center;
      gap: 24px;
      padding-right: 24px;
      background: #1c2733;
      border-bottom: 2px solid #0a0e13;
    }

    /* The 200×200 box holding the arm drawing — on the right, on black */
    .arm-box {
      width: var(--box-w);
      height: var(--bar-h);
      flex: 0 0 var(--box-w);
      margin-left: auto;            /* push to the right end of the bar */
      background: var(--surface);
      border-left: 2px solid #0a0e13;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;            /* clip the shifted arm to the box */
    }
    .arm-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transform: translate(50px, 50px);   /* nudged right 50 / down 50 */
    }

    .btn {
      font-size: 1.2rem;
      font-weight: 700;
      color: #04140a;
      background: var(--trace);
      border: none;
      border-radius: 8px;
      padding: 14px 26px;
      cursor: pointer;
      box-shadow: 0 0 0 2px #0a0e13, 0 4px 14px rgba(57, 255, 20, 0.25);
      transition: transform 0.05s ease, filter 0.15s ease;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:active { transform: translateY(1px); }
    .btn[aria-pressed="true"] { filter: brightness(0.85); }

    /* ── Graph stage + panel ────────────────────── */
    /* The stage: black, with a 10× arm picture as its background. */
    .graph-wrap {
      display: none;                 /* hidden until the button is pressed */
      min-height: calc(100vh - var(--bar-h));
      padding: 48px 24px;
      /* arm picture layered over the ivory/gray surface */
      background-image: url("arm.png"), var(--surface);
      background-repeat: no-repeat, no-repeat;
      /* arm stretched to twice its width, same height (was 2000px auto → ~957px tall) */
      background-size: calc(var(--bg-size) * 2) 957px, 100% 100%;
      background-position: var(--bg-x) var(--bg-y), 0 0;
    }
    .graph-wrap.on { display: block; }

    /* The graph itself is a panel floating above that background. */
    .graph-panel {
      max-width: var(--graph-w);
      margin: 0 auto;
      padding: 16px;
      background: rgba(11, 15, 20, 0.92);
      border: 2px solid #0a0e13;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(2px);
    }
    .graph-title {
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8fa3b5;
      margin: 0 0 8px 2px;
    }
    canvas {
      display: block;
      width: 100%;
      height: var(--graph-h);
      background: var(--panel);
      border: 2px solid #0a0e13;
      border-radius: 8px;
    }

    /* ── Dev panel (type "dev" to toggle) ───────── */
    .dev-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      height: 100%;
      padding: 16px;
      background: rgba(10, 14, 19, 0.96);
      border-right: 2px solid var(--trace);
      box-shadow: 4px 0 18px rgba(0, 0, 0, 0.5);
      z-index: 50;
      overflow-y: auto;
      display: none;
    }
    .dev-panel.on { display: block; }
    .dev-panel h2 {
      margin: 0 0 14px;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--trace);
    }
    .dev-row { margin-bottom: 18px; }
    .dev-row label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #c6d2dd;
      margin-bottom: 6px;
    }
    .dev-row label .val { color: var(--trace); font-variant-numeric: tabular-nums; }
    .dev-row input[type="range"] { width: 100%; accent-color: var(--trace); }
  </style>
</head>
<body>
  <header class="menubar">
    <button id="go" class="btn" aria-pressed="false">Microneurography!</button>

    <!-- 200px-wide box on the right: forearm + hand, on black -->
    <div class="arm-box">
      <img src="arm.png" alt="Forearm and hand" />
    </div>
  </header>

  <aside id="devPanel" class="dev-panel" aria-hidden="true">
    <h2>Dev &mdash; sliders</h2>
    <div class="dev-row">
      <label for="noiseAmp">Amplitude of noise <span class="val" id="noiseAmpVal">0.09</span></label>
      <input type="range" id="noiseAmp" min="0" max="0.5" step="0.005" value="0.09" />
    </div>
    <div class="dev-row">
      <label for="graphW">Graph width <span class="val" id="graphWVal">1000px</span></label>
      <input type="range" id="graphW" min="400" max="1600" step="10" value="1000" />
    </div>
    <div class="dev-row">
      <label for="graphH">Graph height <span class="val" id="graphHVal">320px</span></label>
      <input type="range" id="graphH" min="120" max="640" step="10" value="320" />
    </div>
    <div class="dev-row">
      <label for="bgX">Background X <span class="val" id="bgXVal">-260px</span></label>
      <input type="range" id="bgX" min="-3000" max="1500" step="10" value="-260" />
    </div>
    <div class="dev-row">
      <label for="bgY">Background Y <span class="val" id="bgYVal">80px</span></label>
      <input type="range" id="bgY" min="-3000" max="1500" step="10" value="80" />
    </div>
  </aside>

  <section id="graphWrap" class="graph-wrap" aria-hidden="true">
    <div class="graph-panel">
      <p class="graph-title">Nerve recording &mdash; live</p>
      <canvas id="scope"></canvas>
    </div>
  </section>

  <script>
    const btn = document.getElementById('go');
    const wrap = document.getElementById('graphWrap');
    const canvas = document.getElementById('scope');
    const ctx = canvas.getContext('2d');

    let samples = null;    // one value per pixel-column, right edge = newest
    let raf = null;

    function sizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // (re)build the sample buffer to match the new width
      const cols = Math.round(w);
      const next = new Float32Array(cols).fill(0);
      if (samples) {
        // preserve the most recent values when resizing
        const keep = Math.min(samples.length, cols);
        next.set(samples.subarray(samples.length - keep), cols - keep);
      }
      samples = next;
    }

    const SCROLL = 2;        // pixel-columns of new signal per frame (speed)
    let noiseAmp = 0.09;     // low-level static amplitude (fraction of half-height)

    function nextSample() {
      // low-level static centered on zero
      return (Math.random() * 2 - 1) * noiseAmp;
    }

    function draw() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const mid = h / 2;

      // advance: push SCROLL new samples onto the right, shift the rest left
      samples.copyWithin(0, SCROLL);
      for (let i = 0; i < SCROLL; i++) {
        samples[samples.length - SCROLL + i] = nextSample();
      }

      ctx.clearRect(0, 0, w, h);

      // faint grid
      ctx.strokeStyle = 'rgba(120,160,140,0.12)';
      ctx.lineWidth = 1;
      for (let x = w; x > 0; x -= 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y <= h; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      // center baseline
      ctx.strokeStyle = 'rgba(57,255,20,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();

      // the trace, drawn around the center point
      ctx.strokeStyle = 'var(--trace)';
      ctx.strokeStyle = getComputedStyle(document.documentElement)
        .getPropertyValue('--trace').trim() || '#39ff14';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let x = 0; x < samples.length; x++) {
        const y = mid - samples[x] * mid;   // scale by half-height
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      raf = requestAnimationFrame(draw);
    }

    function start() {
      sizeCanvas();
      if (!raf) raf = requestAnimationFrame(draw);
    }
    function stop() {
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    }

    btn.addEventListener('click', () => {
      const on = wrap.classList.toggle('on');
      btn.setAttribute('aria-pressed', String(on));
      wrap.setAttribute('aria-hidden', String(!on));
      if (on) start(); else stop();
    });

    window.addEventListener('resize', () => {
      if (wrap.classList.contains('on')) sizeCanvas();
    });

    // ── Dev panel: type "dev" anywhere to toggle it ──
    const devPanel = document.getElementById('devPanel');
    let typed = '';
    window.addEventListener('keydown', (e) => {
      // ignore typing while focused in a field
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
      if (e.key.length === 1) {
        typed = (typed + e.key.toLowerCase()).slice(-3);
        if (typed === 'dev') {
          const on = devPanel.classList.toggle('on');
          devPanel.setAttribute('aria-hidden', String(!on));
          typed = '';
        }
      }
    });

    // amplitude-of-noise slider
    const noiseSlider = document.getElementById('noiseAmp');
    const noiseVal = document.getElementById('noiseAmpVal');
    noiseSlider.addEventListener('input', () => {
      noiseAmp = parseFloat(noiseSlider.value);
      noiseVal.textContent = noiseAmp.toFixed(3);
    });

    // background-image X / Y position sliders (tune the 10× arm backdrop)
    const root = document.documentElement;
    function wireBgSlider(id, cssVar) {
      const slider = document.getElementById(id);
      const out = document.getElementById(id + 'Val');
      slider.addEventListener('input', () => {
        const px = slider.value + 'px';
        root.style.setProperty(cssVar, px);
        out.textContent = px;
      });
    }
    wireBgSlider('bgX', '--bg-x');
    wireBgSlider('bgY', '--bg-y');

    // graph box size sliders — resize the panel/canvas, then rebuild buffer
    function wireGraphSlider(id, cssVar) {
      const slider = document.getElementById(id);
      const out = document.getElementById(id + 'Val');
      slider.addEventListener('input', () => {
        const px = slider.value + 'px';
        root.style.setProperty(cssVar, px);
        out.textContent = px;
        if (wrap.classList.contains('on')) sizeCanvas();
      });
    }
    wireGraphSlider('graphW', '--graph-w');
    wireGraphSlider('graphH', '--graph-h');
  </script>
</body>
</html>
