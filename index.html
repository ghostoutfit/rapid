<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Microneurography</title>
  <style>
    :root {
      --bar-h: 200px;
      --box-w: 200px;
      --trace: #39ff14;      /* classic oscilloscope green */
      --panel: #0b0f14;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #11151b;
      color: #e8edf2;
    }

    /* ── Menu bar ───────────────────────────────── */
    .menubar {
      height: var(--bar-h);
      display: flex;
      align-items: center;
      gap: 24px;
      padding-right: 24px;
      background: #1c2733;
      border-bottom: 2px solid #0a0e13;
    }

    /* The 200×200 box holding the arm drawing */
    .arm-box {
      width: var(--box-w);
      height: var(--bar-h);
      flex: 0 0 var(--box-w);
      background: #243343;
      border-right: 2px solid #0a0e13;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .arm-box svg { width: 100%; height: 100%; display: block; }

    .btn {
      font-size: 1.2rem;
      font-weight: 700;
      color: #04140a;
      background: var(--trace);
      border: none;
      border-radius: 8px;
      padding: 14px 26px;
      cursor: pointer;
      box-shadow: 0 0 0 2px #0a0e13, 0 4px 14px rgba(57, 255, 20, 0.25);
      transition: transform 0.05s ease, filter 0.15s ease;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:active { transform: translateY(1px); }
    .btn[aria-pressed="true"] { filter: brightness(0.85); }

    /* ── Graph ──────────────────────────────────── */
    .graph-wrap {
      margin: 24px;
      display: none;                 /* hidden until the button is pressed */
    }
    .graph-wrap.on { display: block; }
    .graph-title {
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8fa3b5;
      margin: 0 0 8px 2px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 320px;
      background: var(--panel);
      border: 2px solid #0a0e13;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header class="menubar">
    <!-- 200px-wide box: forearm + hand of a darker-skinned person,
         with a microneurography electrode in the forearm -->
    <div class="arm-box" aria-label="Arm and hand with recording electrode">
      <svg viewBox="0 0 200 200" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8d5a3c" />
            <stop offset="1" stop-color="#6b3f27" />
          </linearGradient>
        </defs>
        <!-- forearm -->
        <path d="M-5 128 Q 70 118 104 104 L 118 128 Q 80 150 -5 158 Z"
              fill="url(#skin)" stroke="#4e2d1a" stroke-width="2"/>
        <!-- palm -->
        <path d="M104 104 Q 128 92 146 96 Q 168 100 170 118
                 Q 172 136 150 146 Q 128 154 118 128 Z"
              fill="url(#skin)" stroke="#4e2d1a" stroke-width="2"/>
        <!-- fingers -->
        <g fill="url(#skin)" stroke="#4e2d1a" stroke-width="2">
          <path d="M150 97 Q 170 78 182 82 Q 190 86 180 104 Q 166 112 150 108 Z"/>
          <path d="M156 104 Q 180 92 194 98 Q 200 104 188 118 Q 172 124 158 118 Z"/>
          <path d="M156 118 Q 182 114 196 122 Q 200 130 186 138 Q 170 142 156 134 Z"/>
          <path d="M152 132 Q 176 134 188 144 Q 190 152 176 156 Q 160 156 150 146 Z"/>
        </g>
        <!-- thumb -->
        <path d="M110 118 Q 108 140 120 152 Q 132 160 138 150 Q 140 138 126 130 Z"
              fill="url(#skin)" stroke="#4e2d1a" stroke-width="2"/>
        <!-- electrode inserted into the forearm nerve -->
        <line x1="60" y1="134" x2="40" y2="70" stroke="#c9d3dc" stroke-width="3"/>
        <circle cx="60" cy="134" r="4" fill="#39ff14" stroke="#04140a" stroke-width="1.5"/>
        <rect x="32" y="52" width="16" height="20" rx="3" fill="#2b3845" stroke="#c9d3dc" stroke-width="2"/>
      </svg>
    </div>

    <button id="go" class="btn" aria-pressed="false">Microneurography!</button>
  </header>

  <section id="graphWrap" class="graph-wrap" aria-hidden="true">
    <p class="graph-title">Nerve recording &mdash; live</p>
    <canvas id="scope"></canvas>
  </section>

  <script>
    const btn = document.getElementById('go');
    const wrap = document.getElementById('graphWrap');
    const canvas = document.getElementById('scope');
    const ctx = canvas.getContext('2d');

    let samples = null;    // one value per pixel-column, right edge = newest
    let raf = null;

    function sizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // (re)build the sample buffer to match the new width
      const cols = Math.round(w);
      const next = new Float32Array(cols).fill(0);
      if (samples) {
        // preserve the most recent values when resizing
        const keep = Math.min(samples.length, cols);
        next.set(samples.subarray(samples.length - keep), cols - keep);
      }
      samples = next;
    }

    const SCROLL = 2;        // pixel-columns of new signal per frame (speed)
    const NOISE = 0.09;      // low-level static amplitude (fraction of half-height)

    function nextSample() {
      // low-level static centered on zero
      return (Math.random() * 2 - 1) * NOISE;
    }

    function draw() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const mid = h / 2;

      // advance: push SCROLL new samples onto the right, shift the rest left
      samples.copyWithin(0, SCROLL);
      for (let i = 0; i < SCROLL; i++) {
        samples[samples.length - SCROLL + i] = nextSample();
      }

      ctx.clearRect(0, 0, w, h);

      // faint grid
      ctx.strokeStyle = 'rgba(120,160,140,0.12)';
      ctx.lineWidth = 1;
      for (let x = w; x > 0; x -= 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y <= h; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      // center baseline
      ctx.strokeStyle = 'rgba(57,255,20,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();

      // the trace, drawn around the center point
      ctx.strokeStyle = 'var(--trace)';
      ctx.strokeStyle = getComputedStyle(document.documentElement)
        .getPropertyValue('--trace').trim() || '#39ff14';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let x = 0; x < samples.length; x++) {
        const y = mid - samples[x] * mid;   // scale by half-height
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      raf = requestAnimationFrame(draw);
    }

    function start() {
      sizeCanvas();
      if (!raf) raf = requestAnimationFrame(draw);
    }
    function stop() {
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    }

    btn.addEventListener('click', () => {
      const on = wrap.classList.toggle('on');
      btn.setAttribute('aria-pressed', String(on));
      wrap.setAttribute('aria-hidden', String(!on));
      if (on) start(); else stop();
    });

    window.addEventListener('resize', () => {
      if (wrap.classList.contains('on')) sizeCanvas();
    });
  </script>
</body>
</html>
